<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Can & Bottle Collection</title>
    <link rel="stylesheet" href="css/style.css?v=4">
</head>
<body>

    <header>
        <nav>
            <a href="index.html" class="active">Accueil</a>
            <a href="collection.html">Ma Collection</a>
        </nav>
        <h1>CAN & BOTTLE COLLEC</h1>
    </header>

    <main class="container">
        <h1 class="hero-title">Bienvenue sur ma Collection</h1>
        <p class="hero-subtitle">Découvrez mes dernières acquisitions de cannettes et bouteilles du monde entier.</p>

        <!-- Barre de recherche -->
        <div class="search-container">
            <input type="text" id="searchInput" placeholder="🔍 Rechercher une cannette, bouteille..." onkeyup="filterCollection()">
        </div>

        <h2 class="section-title">🔥 Les 10 Derniers Ajouts</h2>

        <div class="grid-container" id="collectionGrid">
            <!-- Cartes par défaut (si JavaScript est désactivé ou met un instant à charger) -->
            <div class="card" onclick="openModal('Brewmaker - Instinct Sauvage', 'images/can1.png', 'Cannette', '33cl', 'Double IPA', 'France', '4.5/5', 'Édition limitée avec illustration d\'artiste contemporain.')">
                <img src="images/can1.png" alt="Brewmaker Instinct Sauvage">
                <div class="card-info">
                    <div class="card-title">Brewmaker - Instinct Sauvage</div>
                    <div class="card-rating">⭐ 4.5/5</div>
                </div>
            </div>

            <div class="card" onclick="openModal('Chimay Bleue Grande Réserve', 'images/bouteille1.png', 'Bouteille', '75cl', 'Trappiste', 'Belgique', '5/5', 'Bière trappiste belge foncée brassée à l\'Abbaye de Scourmont.')">
                <img src="images/bouteille1.png" alt="Chimay Bleue">
                <div class="card-info">
                    <div class="card-title">Chimay Bleue Grande Réserve</div>
                    <div class="card-rating">⭐ 5/5</div>
                </div>
            </div>
        </div>
    </main>

    <!-- Fenêtre Modale -->
    <div id="itemModal" class="modal">
        <div class="modal-content">
            <span class="close-btn" onclick="closeModal()">&times;</span>
            <img id="modalImg" src="" alt="Image produit">
            <h2 id="modalTitle"></h2>
            <div class="modal-tags">
                <span class="tag" id="modalType"></span>
                <span class="tag" id="modalVolume"></span>
                <span class="tag" id="modalStyle"></span>
                <span class="tag" id="modalCountry"></span>
            </div>
            <p id="modalRating" style="color: #ffb703; font-weight: bold; margin: 10px 0;"></p>
            <p id="modalDescription" style="color: #bbb; font-size: 0.9rem;"></p>
        </div>
    </div>

    <!-- Lien vers votre fichier JS (js/app.js) -->
    <script src="js/app.js"></script>
</body>
</html>
