<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Toute la Collection</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <header>
    <nav class="navbar">
      <div class="logo">🥤 Can & Bottle Collec</div>
      <ul class="nav-links">
        <li><a href="index.html">Accueil</a></li>
        <li><a href="collection.html" class="active">Ma Collection</a></li>
      </ul>
    </nav>
  </header>

  <main class="collection-page">
    <h1>Ma Collection Complete</h1>

    <!-- Barre de Filtres Multiples -->
    <div class="filters">
      <select id="filter-type">
        <option value="">Tous les types</option>
        <option value="Cannette">Cannette</option>
        <option value="Bouteille">Bouteille</option>
      </select>

      <select id="filter-volume">
        <option value="">Tous les volumes</option>
        <option value="25cl">25cl</option>
        <option value="33cl">33cl</option>
        <option value="50cl">50cl</option>
        <option value="75cl">75cl</option>
      </select>

      <select id="filter-theme">
        <option value="">Tous les thèmes</option>
        <option value="Illustration femme">Illustration femme</option>
        <option value="Trappiste">Trappiste</option>
      </select>

      <select id="filter-pays">
        <option value="">Tous les pays</option>
        <option value="France">France</option>
        <option value="Belgique">Belgique</option>
      </select>
    </div>

    <!-- Grille de la Collection -->
    <div class="grid" id="collection-grid">
      <!-- Cartes injectées dynamiquement -->
    </div>
  </main>

  <!-- Modal pour afficher les détails et la note au clic sur la photo -->
  <div id="modal" class="modal">
    <div class="modal-content">
      <span class="close-btn" id="close-modal">&times;</span>
      <img id="modal-img" src="" alt="Détail">
      <h2 id="modal-title"></h2>
      <div class="tags" id="modal-tags"></div>
      <div class="rating" id="modal-rating"></div>
      <p id="modal-desc"></p>
    </div>
  </div>

  <script src="js/app.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', loadCollection);
  </script>
</body>
</html>
